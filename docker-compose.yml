# Faqat Postgres — mahalliy dev uchun. Bot jarayonining o'zi shu yerda emas
# (VPS'ga chiqishda alohida qaror qilinadi — 02-hujjat, §1 "Yolg'iz odamga
# 2 ta deploy pipeline kerak emas").
#
# Ishga tushirish: docker compose up -d
# .env'dagi DATABASE_URL quyidagi qiymatlar bilan mos:
#   postgresql://ielts:ielts@localhost:5432/ielts_bot

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ielts
      POSTGRES_DB: ielts_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
